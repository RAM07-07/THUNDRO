<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>THUNDRO OG Poster Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #040605;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }
    #poster-container {
      width: 1200px;
      height: 630px;
      position: relative;
      background: #040605;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 64px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
    }

    /* Ambient Lighting & Gradients */
    .glow-center {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(183, 255, 69, 0.16) 0%, rgba(183, 255, 69, 0.04) 45%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }
    .glow-corner-tl {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(183, 255, 69, 0.1) 0%, transparent 65%);
      pointer-events: none;
      filter: blur(50px);
    }
    .glow-corner-br {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(183, 255, 69, 0.12) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(60px);
    }

    /* Cyber grid overlay */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.8) 0%, transparent 80%);
      pointer-events: none;
    }

    /* Outer border ring */
    .outer-border {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(183, 255, 69, 0.18);
      border-radius: 20px;
      pointer-events: none;
    }
    .outer-border-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #B7FF45;
      pointer-events: none;
    }
    .corner-tl { top: 12px; left: 12px; border-top: 2px solid #B7FF45; border-left: 2px solid #B7FF45; border-top-left-radius: 20px; }
    .corner-tr { top: 12px; right: 12px; border-top: 2px solid #B7FF45; border-right: 2px solid #B7FF45; border-top-right-radius: 20px; }
    .corner-bl { bottom: 12px; left: 12px; border-bottom: 2px solid #B7FF45; border-left: 2px solid #B7FF45; border-bottom-left-radius: 20px; }
    .corner-br { bottom: 12px; right: 12px; border-bottom: 2px solid #B7FF45; border-right: 2px solid #B7FF45; border-bottom-right-radius: 20px; }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(183, 255, 69, 0.06);
      border: 1px solid rgba(183, 255, 69, 0.35);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #B7FF45;
      box-shadow: 0 0 20px rgba(183, 255, 69, 0.15);
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #B7FF45;
      border-radius: 50%;
      box-shadow: 0 0 10px #B7FF45;
    }
    .top-meta {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
    }

    /* Main Center Section */
    .center-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      z-index: 10;
      margin-top: -10px;
    }

    .logo-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-canvas {
      filter: drop-shadow(0 0 25px rgba(183, 255, 69, 0.45)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      max-width: 680px;
      height: auto;
    }

    .tagline-h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      text-transform: uppercase;
      line-height: 1.15;
      margin-bottom: 12px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .tagline-h1 span {
      background: linear-gradient(135deg, #B7FF45 0%, #E6FFA8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 20px rgba(183, 255, 69, 0.4));
    }

    .sub-tagline {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.05em;
      max-width: 820px;
      line-height: 1.5;
    }

    /* Bottom Features / Pills */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .feature-pills {
      display: flex;
      gap: 14px;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.02em;
    }
    .pill-icon {
      color: #B7FF45;
      font-size: 14px;
    }

    .domain-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(183, 255, 69, 0.1);
      border: 1px solid rgba(183, 255, 69, 0.4);
      border-radius: 9999px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.04em;
      box-shadow: 0 0 25px rgba(183, 255, 69, 0.2);
    }
    .domain-badge .arrow {
      color: #B7FF45;
      font-size: 16px;
      transition: transform 0.2s;
    }
  </style>
</head>
<body>

  <div id="poster-container">
    <!-- Ambient Glows -->
    <div class="glow-center"></div>
    <div class="glow-corner-tl"></div>
    <div class="glow-corner-br"></div>
    <div class="grid-overlay"></div>

    <!-- Tech borders & corners -->
    <div class="outer-border"></div>
    <div class="outer-border-corner corner-tl"></div>
    <div class="outer-border-corner corner-tr"></div>
    <div class="outer-border-corner corner-bl"></div>
    <div class="outer-border-corner corner-br"></div>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="badge">
        <span class="badge-dot"></span>
        <span>Next-Gen Digital Agency</span>
      </div>
      <div class="top-meta">
        High-Performance Web & 3D Experiences
      </div>
    </div>

    <!-- Center Section -->
    <div class="center-section">
      <div class="logo-wrapper">
        <canvas id="logo-canvas" class="logo-canvas"></canvas>
      </div>

      <h1 class="tagline-h1">
        We Build Your <span>Digital Future.</span>
      </h1>

      <p class="sub-tagline">
        Premium Web Design • Full-Stack Development • Interactive 3D WebGL • UI/UX Strategy
      </p>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <div class="feature-pills">
        <div class="pill">
          <span class="pill-icon">⚡</span>
          <span>60 FPS Fluid Motion</span>
        </div>
        <div class="pill">
          <span class="pill-icon">🚀</span>
          <span>Scalable React & Next Architecture</span>
        </div>
        <div class="pill">
          <span class="pill-icon">✦</span>
          <span>100% Bespoke Design</span>
        </div>
      </div>

      <div class="domain-badge">
        <span>thundro.vercel.app</span>
        <span class="arrow">↗</span>
      </div>
    </div>
  </div>

  <script>
    // Load and crop the brand logo cleanly from brand-logo-dark.png
    const canvas = document.getElementById('logo-canvas');
    const ctx = canvas.getContext('2d');

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = '/brand-logo-dark.png';

    img.onload = () => {
      // Find bounding box of logo in brand-logo-dark.png
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = img.naturalWidth;
      tempCanvas.height = img.naturalHeight;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0);

      const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const data = imgData.data;

      let minX = tempCanvas.width, maxX = 0;
      let minY = tempCanvas.height, maxY = 0;

      // Threshold for black background (scan Y between 300 and 700 to isolate the central logo)
      for (let y = 300; y < 700; y++) {
        for (let x = 0; x < tempCanvas.width; x++) {
          const idx = (y * tempCanvas.width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          // If not near black
          if (r > 35 || g > 35 || b > 35) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      // Add a small padding around the logo
      const padX = 8;
      const padY = 8;
      minX = Math.max(0, minX - padX);
      minY = Math.max(0, minY - padY);
      maxX = Math.min(tempCanvas.width, maxX + padX);
      maxY = Math.min(tempCanvas.height, maxY + padY);

      const cropW = maxX - minX;
      const cropH = maxY - minY;

      // Scale to desired width on poster
      const targetW = 660;
      const targetH = Math.round((cropH / cropW) * targetW);

      canvas.width = targetW;
      canvas.height = targetH;

      ctx.drawImage(img, minX, minY, cropW, cropH, 0, 0, targetW, targetH);

      // Make black background transparent so the logo seamlessly floats
      const logoData = ctx.getImageData(0, 0, targetW, targetH);
      const d = logoData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i];
        const g = d[i + 1];
        const b = d[i + 2];
        const maxVal = Math.max(r, g, b);
        if (maxVal < 26) {
          d[i + 3] = 0; // Pure transparent
        } else if (maxVal < 55) {
          d[i + 3] = Math.round(((maxVal - 26) / 29) * 255); // Smooth fade
        }
      }
      ctx.putImageData(logoData, 0, 0);

      // Now render the standalone 1200x630 export canvas
      renderExportCanvas(canvas);

      window.__LOGO_READY__ = true;
    };

    function renderExportCanvas(logoCanvas) {
      const fc = document.createElement('canvas');
      fc.id = 'full-export-canvas';
      fc.width = 1200;
      fc.height = 630;
      const fCtx = fc.getContext('2d');

      // 1. Base Dark Background
      fCtx.fillStyle = '#040605';
      fCtx.fillRect(0, 0, 1200, 630);

      // 2. Ambient Glows
      // Center Glow
      const centerGlow = fCtx.createRadialGradient(600, 260, 20, 600, 260, 480);
      centerGlow.addColorStop(0, 'rgba(183, 255, 69, 0.22)');
      centerGlow.addColorStop(0.35, 'rgba(183, 255, 69, 0.08)');
      centerGlow.addColorStop(0.7, 'rgba(183, 255, 69, 0.02)');
      centerGlow.addColorStop(1, 'rgba(4, 6, 5, 0)');
      fCtx.fillStyle = centerGlow;
      fCtx.fillRect(0, 0, 1200, 630);

      // Top-Left Corner Glow
      const tlGlow = fCtx.createRadialGradient(0, 0, 0, 0, 0, 360);
      tlGlow.addColorStop(0, 'rgba(183, 255, 69, 0.12)');
      tlGlow.addColorStop(1, 'transparent');
      fCtx.fillStyle = tlGlow;
      fCtx.fillRect(0, 0, 1200, 630);

      // Bottom-Right Corner Glow
      const brGlow = fCtx.createRadialGradient(1200, 630, 0, 1200, 630, 420);
      brGlow.addColorStop(0, 'rgba(183, 255, 69, 0.15)');
      brGlow.addColorStop(1, 'transparent');
      fCtx.fillStyle = brGlow;
      fCtx.fillRect(0, 0, 1200, 630);

      // 3. Cyber Grid Lines
      fCtx.lineWidth = 1;
      for (let x = 40; x < 1200; x += 40) {
        const distFromCenter = Math.abs(x - 600) / 600;
        const alpha = Math.max(0, 0.04 * (1 - distFromCenter * 0.7));
        fCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        fCtx.beginPath();
        fCtx.moveTo(x, 0);
        fCtx.lineTo(x, 630);
        fCtx.stroke();
      }
      for (let y = 40; y < 630; y += 40) {
        const distFromCenter = Math.abs(y - 315) / 315;
        const alpha = Math.max(0, 0.04 * (1 - distFromCenter * 0.7));
        fCtx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        fCtx.beginPath();
        fCtx.moveTo(0, y);
        fCtx.lineTo(1200, y);
        fCtx.stroke();
      }

      // 4. Outer Rounded Frame & Glowing Corner Brackets
      fCtx.save();
      fCtx.lineWidth = 1.5;
      fCtx.strokeStyle = 'rgba(183, 255, 69, 0.22)';
      drawRoundedRect(fCtx, 16, 16, 1168, 598, 20);
      fCtx.stroke();

      // Corner Brackets
      fCtx.lineWidth = 2.5;
      fCtx.strokeStyle = '#B7FF45';
      fCtx.shadowColor = '#B7FF45';
      fCtx.shadowBlur = 10;

      // Top-Left
      fCtx.beginPath();
      fCtx.moveTo(16, 44);
      fCtx.lineTo(16, 36);
      fCtx.arcTo(16, 16, 36, 16, 20);
      fCtx.lineTo(44, 16);
      fCtx.stroke();

      // Top-Right
      fCtx.beginPath();
      fCtx.moveTo(1184 - 28, 16);
      fCtx.lineTo(1184 - 20, 16);
      fCtx.arcTo(1184, 16, 1184, 36, 20);
      fCtx.lineTo(1184, 44);
      fCtx.stroke();

      // Bottom-Left
      fCtx.beginPath();
      fCtx.moveTo(16, 614 - 28);
      fCtx.lineTo(16, 614 - 20);
      fCtx.arcTo(16, 614, 36, 614, 20);
      fCtx.lineTo(44, 614);
      fCtx.stroke();

      // Bottom-Right
      fCtx.beginPath();
      fCtx.moveTo(1184 - 28, 614);
      fCtx.lineTo(1184 - 20, 614);
      fCtx.arcTo(1184, 614, 1184, 594, 20);
      fCtx.lineTo(1184, 570);
      fCtx.stroke();
      fCtx.restore();

      // 5. Top Bar Elements
      // Left Badge Pill
      fCtx.save();
      fCtx.fillStyle = 'rgba(183, 255, 69, 0.08)';
      fCtx.strokeStyle = 'rgba(183, 255, 69, 0.4)';
      fCtx.lineWidth = 1;
      drawRoundedRect(fCtx, 56, 48, 250, 36, 18);
      fCtx.fill();
      fCtx.stroke();

      // Green dot
      fCtx.fillStyle = '#B7FF45';
      fCtx.shadowColor = '#B7FF45';
      fCtx.shadowBlur = 8;
      fCtx.beginPath();
      fCtx.arc(74, 66, 4, 0, Math.PI * 2);
      fCtx.fill();
      fCtx.restore();

      // Badge text
      fCtx.save();
      fCtx.font = '700 12px "Space Grotesk", sans-serif';
      fCtx.fillStyle = '#B7FF45';
      fCtx.letterSpacing = '1.2px';
      fCtx.fillText('NEXT-GEN DIGITAL AGENCY', 88, 70);
      fCtx.restore();

      // Top Right Meta text
      fCtx.save();
      fCtx.font = '600 12px "Inter", sans-serif';
      fCtx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      fCtx.textAlign = 'right';
      fCtx.letterSpacing = '1.5px';
      fCtx.fillText('HIGH-PERFORMANCE WEB & 3D EXPERIENCES', 1144, 70);
      fCtx.restore();

      // 6. Draw Logo in Center
      fCtx.save();
      const logoX = (1200 - logoCanvas.width) / 2;
      const logoY = 135;

      // Under-logo radial aura
      const logoAura = fCtx.createRadialGradient(600, logoY + logoCanvas.height / 2, 20, 600, logoY + logoCanvas.height / 2, 320);
      logoAura.addColorStop(0, 'rgba(183, 255, 69, 0.35)');
      logoAura.addColorStop(0.5, 'rgba(183, 255, 69, 0.08)');
      logoAura.addColorStop(1, 'transparent');
      fCtx.fillStyle = logoAura;
      fCtx.fillRect(200, 80, 800, 300);

      // Logo drop shadow
      fCtx.shadowColor = 'rgba(183, 255, 69, 0.5)';
      fCtx.shadowBlur = 30;
      fCtx.drawImage(logoCanvas, logoX, logoY);
      fCtx.restore();

      // 7. Headline: "WE BUILD YOUR DIGITAL FUTURE."
      fCtx.save();
      fCtx.textAlign = 'center';
      fCtx.textBaseline = 'middle';
      const headlineY = 385;

      fCtx.font = '800 40px "Space Grotesk", sans-serif';
      // Compute widths
      const text1 = 'WE BUILD YOUR ';
      const text2 = 'DIGITAL FUTURE.';
      const w1 = fCtx.measureText(text1).width;
      const w2 = fCtx.measureText(text2).width;
      const totalW = w1 + w2;
      const startX = (1200 - totalW) / 2;

      // Draw "WE BUILD YOUR "
      fCtx.fillStyle = '#FFFFFF';
      fCtx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      fCtx.shadowBlur = 15;
      fCtx.textAlign = 'left';
      fCtx.fillText(text1, startX, headlineY);

      // Draw "DIGITAL FUTURE." in #B7FF45
      fCtx.fillStyle = '#B7FF45';
      fCtx.shadowColor = 'rgba(183, 255, 69, 0.5)';
      fCtx.shadowBlur = 25;
      fCtx.fillText(text2, startX + w1, headlineY);
      fCtx.restore();

      // 8. Subtitle
      fCtx.save();
      fCtx.font = '500 16px "Inter", sans-serif';
      fCtx.fillStyle = 'rgba(255, 255, 255, 0.78)';
      fCtx.textAlign = 'center';
      fCtx.textBaseline = 'middle';
      fCtx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      fCtx.shadowBlur = 8;
      fCtx.fillText('Premium Web Design  •  Full-Stack Development  •  Interactive 3D WebGL  •  UI/UX Strategy', 600, 430);
      fCtx.restore();

      // 9. Bottom Features Badges
      const pills = [
        { icon: '⚡', label: '60 FPS Fluid Motion' },
        { icon: '🚀', label: 'Scalable React & Next Architecture' },
        { icon: '✦', label: '100% Bespoke Design' }
      ];

      let curX = 56;
      const pillY = 540;
      const pillH = 38;

      fCtx.save();
      fCtx.font = '600 13px "Inter", sans-serif';
      for (const p of pills) {
        const textMetrics = fCtx.measureText(p.label);
        const pillW = textMetrics.width + 48;

        fCtx.fillStyle = 'rgba(255, 255, 255, 0.035)';
        fCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        fCtx.lineWidth = 1;
        drawRoundedRect(fCtx, curX, pillY, pillW, pillH, 12);
        fCtx.fill();
        fCtx.stroke();

        // Icon
        fCtx.fillStyle = '#B7FF45';
        fCtx.textAlign = 'left';
        fCtx.fillText(p.icon, curX + 14, pillY + 23);

        // Label
        fCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        fCtx.fillText(p.label, curX + 34, pillY + 23);

        curX += pillW + 14;
      }
      fCtx.restore();

      // 10. Domain Badge (Bottom Right)
      fCtx.save();
      const domainW = 210;
      const domainX = 1144 - domainW;
      fCtx.fillStyle = 'rgba(183, 255, 69, 0.1)';
      fCtx.strokeStyle = 'rgba(183, 255, 69, 0.45)';
      fCtx.lineWidth = 1;
      drawRoundedRect(fCtx, domainX, pillY, domainW, pillH, 19);
      fCtx.fill();
      fCtx.stroke();

      fCtx.font = '700 14px "Space Grotesk", sans-serif';
      fCtx.fillStyle = '#FFFFFF';
      fCtx.fillText('thundro.vercel.app', domainX + 22, pillY + 24);

      fCtx.fillStyle = '#B7FF45';
      fCtx.font = '700 16px "Space Grotesk", sans-serif';
      fCtx.fillText('↗', domainX + domainW - 28, pillY + 24);
      fCtx.restore();

      // Store in window for direct extraction
      window.__POSTER_DATA_URL__ = fc.toDataURL('image/png');
      document.body.appendChild(fc);
      fc.style.display = 'none';
      console.log('Export canvas successfully generated!');
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.arcTo(x + width, y, x + width, y + radius, radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
      ctx.lineTo(x + radius, y + height);
      ctx.arcTo(x, y + height, x, y + height - radius, radius);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();
    }
  </script>
</body>
</html>
